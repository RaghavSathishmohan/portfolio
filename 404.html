<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Raghav Sathishmohan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#07080c;--ink:#e9edf6;--muted:#8b93a7;--dim:#5b6377;--cyan:#38e1ff;--lime:#b8ff5c;
--grad:linear-gradient(120deg,#38e1ff,#8b7bff 55%,#ff7ac6);--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',var(--sans)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 600px at 70% -10%,rgba(139,123,255,.14),transparent 60%),radial-gradient(900px 500px at 10% 10%,rgba(56,225,255,.12),transparent 55%),var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(1000px 700px at 50% 40%,#000 30%,transparent 85%)}
.wrap{max-width:560px;text-align:center}
.code{font-family:var(--disp);font-size:clamp(88px,22vw,180px);font-weight:700;line-height:1;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.term{font-family:var(--mono);font-size:14px;text-align:left;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 20px;margin:22px 0 30px;color:var(--muted)}
.term .p{color:var(--lime)}
.term .c{display:inline-block;width:8px;height:1.05em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.term .r{color:var(--dim);margin-top:6px}
h1{font-family:var(--disp);font-size:clamp(22px,4vw,30px);font-weight:600;margin-bottom:10px}
p.sub{color:var(--muted);margin-bottom:28px}
.btn{font-family:var(--mono);font-size:14px;font-weight:600;padding:14px 24px;border-radius:12px;background:var(--grad);color:#050810;text-decoration:none;display:inline-flex;gap:8px;align-items:center;transition:.22s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(139,123,255,.35)}
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="code">404</div>
  <div class="term">
    <div><span class="p">raghav@portfolio</span>:~$ cd <span id="path">this-page</span></div>
    <div class="r" id="err">bash: cd: this-page: No such file or directory<span class="c"></span></div>
  </div>
  <h1>This route doesn't exist… yet.</h1>
  <p class="sub">Even the best pipelines hit a dead end sometimes. Let's get you back to something I actually built.</p>
  <a class="btn" href="/">← cd ~/home</a>
</div>
<script>
const path=location.pathname.replace(/^\//,'')||'this-page';
document.getElementById('path').textContent=path;
document.getElementById('err').firstChild.textContent='bash: cd: '+path+': No such file or directory';
</script>
</body>
</html>
